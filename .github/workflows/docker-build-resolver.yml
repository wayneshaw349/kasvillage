name: Build and Push kaspa-resolver

on:
  push:
    branches: [ "main" ]
    paths:
      - 'kaspa_resolver/src/**'
      - 'kaspa_resolver/Cargo.toml'
      - 'kaspa_resolver/Cargo.lock'
      - 'kaspa_resolver/Dockerfile'
      - 'kaspa_resolver/Resolver.toml'

jobs:
  build-resolver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v4
        with:
          context: ./kaspa_resolver
          file: ./kaspa_resolver/Dockerfile
          push: true
          tags: |
            wayneshaw349/kaspa-resolver:v1
            wayneshaw349/kaspa-resolver:latest
            wayneshaw349/kaspa-resolver:${{ github.sha }}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KasVillage</title>
  <meta name="theme-color" content="#4F46E5" />
  <meta name="description" content="L2 Privacy Payments on Kaspa" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; }
    #root { min-height: 100vh; }
    .loading-screen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; color: #e2e8f0;
    }
    .loading-spinner {
      width: 48px; height: 48px; border: 4px solid #334155;
      border-top-color: #6366f1; border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { margin-top: 16px; font-size: 14px; opacity: 0.7; }
    .loading-error { color: #f87171; margin-top: 8px; font-size: 12px; display: none; }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-screen">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading KasVillage...</div>
      <div class="loading-error" id="load-error">Failed to load. <a href="?reset=1" style="color:#6366f1">Try reset</a></div>
    </div>
  </div>
  <script>
    // Show error if app fails to load after 10s
    setTimeout(() => {
      if (document.querySelector('.loading-screen')) {
        document.getElementById('load-error').style.display = 'block';
      }
    }, 10000);
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
